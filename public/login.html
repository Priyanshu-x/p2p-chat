<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Relay - Secure Login</title>
    <meta name="description" content="Secure, minimalist P2P chat relay. No logs, just privacy.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body class="flex items-center justify-center p-4">
    <div class="minimal-card flex flex-col items-center">
        <img src="favicon.svg" alt="Logo" class="w-16 h-16 mb-4 opacity-90">
        <h1 class="text-2xl font-light mb-2 tracking-[0.3em] uppercase">Private Relay</h1>
        <p class="text-xs text-gray-500 mb-8 uppercase tracking-widest text-center">Zero Logs. Pure Connection.</p>
        <form id="loginForm" class="w-full flex flex-col gap-6">
            <input type="text" id="username" placeholder="USERNAME" required class="input-field">
            <input type="password" id="password" placeholder="PASSWORD" required class="input-field">
            <button type="submit" class="btn-primary mt-4">ENTER</button>
        </form>
        <div class="mt-6 text-xs text-gray-500 uppercase tracking-widest">
            <span>New here? </span><a href="register.html"
                class="text-blue-500 hover:text-white transition-colors">Register</a>
        </div>
        <p class="error mt-4 text-red-500 text-xs uppercase tracking-wider" id="errorMessage"></p>
    </div>
    <script src="auth.js"></script>
</body>

</html>
