<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Relay - Join Now</title>
    <meta name="description" content="Create your secure identity on Private Relay.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body class="flex items-center justify-center p-4">
    <div class="minimal-card flex flex-col items-center">
        <h1 class="text-2xl font-light mb-8 tracking-widest uppercase">Register</h1>
        <form id="registerForm" class="w-full flex flex-col gap-6">
            <input type="text" id="username" placeholder="USERNAME" required class="input-field">
            <input type="password" id="password" placeholder="PASSWORD" required class="input-field">
            <button type="submit" class="btn-success mt-4 w-full">CREATE ACCOUNT</button>
        </form>
        <div class="mt-6 text-xs text-gray-500 uppercase tracking-widest">
            <span>Have an account? </span><a href="login" class="text-blue-500 hover:text-white transition-colors">Login</a>
        </div>
        <p class="error mt-4 text-red-500 text-xs uppercase tracking-wider" id="errorMessage"></p>
    </div>
    <script src="auth.js"></script>
</body>

</html>
